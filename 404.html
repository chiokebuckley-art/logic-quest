<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Logic Quest</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e5e7eb;
         font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  main { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; color: #c9a227; letter-spacing: 0.12em; font-size: 28px; }
  p { margin: 0; color: #cbd5e1; line-height: 1.5; font-size: 17px; }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>LOGIC QUEST</h1>
  <p>Learn logic by solving puzzles, one step at a time.</p>
  <p>The first stops are on their way. Check back soon.</p>
</main>
</body>
</html>
